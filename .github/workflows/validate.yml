name: Validate

# Checks the whole site Mintlify deploys from main: the Exmergo pages here and
# every product section committed by its own repository's release (dex/).
# Mintlify's GitHub App does the deploying; this workflow is what stops a broken
# page, link, anchor, redirect or colour contrast from reaching it unnoticed.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in step with MINT_VERSION in exmergo/dex's docs-site workflow, which
  # validates the same site before it publishes the Dex section here.
  MINT_VERSION: "4.2.994"
  DO_NOT_TRACK: "1"
  MINTLIFY_TELEMETRY_DISABLED: "1"

jobs:
  mintlify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Installed outside the checkout, so no dependency tree lands in the site.
      - name: Install the Mintlify CLI
        run: npm install --prefix "$RUNNER_TEMP/mint" --no-audit --no-fund --silent "mint@${MINT_VERSION}"
      - name: Validate
        run: |
          mint="$RUNNER_TEMP/mint/node_modules/.bin/mint"
          "$mint" --version
          "$mint" validate
          "$mint" broken-links --check-anchors --check-redirects --check-snippets
          "$mint" a11y

  # A product folder is written by that product's release workflow, which
  # commits to main directly. A pull request that edits one is a hand edit the
  # next release would silently replace, so it fails here unless a maintainer
  # labels it product-sync (for example, the first copy of a new section).
  product-folders:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Product folders are not edited by hand
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          SYNC: ${{ contains(github.event.pull_request.labels.*.name, 'product-sync') }}
        run: |
          set -euo pipefail
          touched=$(git diff --name-only "$BASE" "$HEAD" -- dex/ || true)
          if [ -z "$touched" ]; then
            echo "No product folder changed."
            exit 0
          fi
          if [ "$SYNC" = "true" ]; then
            echo "::notice::Product folders changed, allowed by the product-sync label."
            exit 0
          fi
          echo "::error::These files are generated by their product's release and replaced on the next one:"
          echo "$touched"
          echo "Change the source in the product's repository instead (dex/: exmergo/dex)."
          exit 1
